---
- name: Uninstall Nginx from all servers
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Stop and disable Nginx service
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove Nginx from Debian/Ubuntu
      ansible.builtin.apt:
        name:
          - nginx
          - nginx-common
          - nginx-core
        state: absent
        purge: true
        autoremove: true
      when: ansible_os_family == "Debian"

    - name: Remove Nginx packages from RHEL
      ansible.builtin.dnf:
        name:
          - nginx
          - nginx-core
          - nginx-filesystem
        state: absent
      when: ansible_os_family == "RedHat"

    - name: Check whether Nginx command still exists
      ansible.builtin.command: nginx -v
      register: nginx_check
      changed_when: false
      failed_when: false

    - name: Confirm Nginx removal
      ansible.builtin.assert:
        that:
          - nginx_check.rc != 0
        success_msg: "Nginx has been completely removed from {{ inventory_hostname }}"
        fail_msg: "Nginx is still installed on {{ inventory_hostname }}"
